plugins {
    id 'java-library'
}

description = 'Security module library'
group = 'ec.todo_ecuador.libs'

base {
    archivesName = 'security-lib'
}

dependencies {
    implementation 'jakarta.servlet:jakarta.servlet-api:6.1.0'
    implementation 'org.slf4j:slf4j-api:2.0.13'
    api "org.springframework.security:spring-security-core:7.0.3"
    api "org.springframework.security:spring-security-config:7.0.3"
    api "org.springframework.security:spring-security-oauth2-resource-server:7.0.3"
    api "org.springframework.security:spring-security-oauth2-jose:7.0.3"
    compileOnly "org.projectlombok:lombok:1.18.38"
    annotationProcessor "org.projectlombok:lombok:1.18.38"
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor:4.0.3'
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework.boot:spring-boot:4.0.3'
}